<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap" style="max-width: 420px;">
  <header class="top" style="justify-content:center; border-bottom:none;">
    <div class="brand">
      <img src="assets/logo.png" alt="eCAPS" class="logo" />
    </div>
  </header>

  <div class="card">
    <p class="section-title">Sign in</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required />
      </div>
      <button type="submit" class="primary" id="loginBtn" style="width:100%;">Sign in</button>
      <div id="loginMsg"></div>
    </form>
    <p class="note" style="margin-top:16px;">
      Don't have an account? Ask your admin to invite you — accounts aren't self-service.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const msg = document.getElementById("loginMsg");
  msg.innerHTML = "";
  btn.disabled = true;
  btn.textContent = "Signing in…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    msg.innerHTML = `<div class="error-box">${error.message}</div>`;
    btn.disabled = false;
    btn.textContent = "Sign in";
  } else {
    window.location.href = "index.html";
  }
});

// If already logged in, skip straight to the app.
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = "index.html";
});
</script>
</body>
</html>
