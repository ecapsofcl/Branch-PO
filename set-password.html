<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set your password</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap" style="max-width: 420px;">
  <header class="top" style="justify-content:center; border-bottom:none;">
    <div class="brand">
      <img src="assets/logo.png" alt="eCAPS" class="logo" />
    </div>
  </header>

  <div class="card">
    <p class="section-title">Set your password</p>
    <p class="note">You've been invited to the PO Approval System. Choose a password to finish setting up your account.</p>
    <form id="setPwForm">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" type="password" required minlength="8" />
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" required minlength="8" />
      </div>
      <button type="submit" class="primary" id="setPwBtn" style="width:100%;">Set password &amp; continue</button>
      <div id="setPwMsg"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
document.getElementById("setPwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("setPwBtn");
  const msg = document.getElementById("setPwMsg");
  msg.innerHTML = "";

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  if (password !== confirm) {
    msg.innerHTML = `<div class="error-box">Passwords don't match.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Saving…";

  // The invite link's token is picked up automatically by the Supabase
  // client (detectSessionInUrl), which establishes a temporary session.
  const { error } = await sb.auth.updateUser({ password });

  if (error) {
    msg.innerHTML = `<div class="error-box">${error.message}</div>`;
    btn.disabled = false;
    btn.textContent = "Set password & continue";
  } else {
    window.location.href = "index.html";
  }
});
</script>
</body>
</html>
