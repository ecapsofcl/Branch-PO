<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PO Builder</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="assets/logo.png" alt="eCAPS" class="logo" />
      <h1>Purchase Order Builder</h1>
    </div>
    <div class="sub" id="authNav"></div>
  </header>

  <p style="font-size:12.5px; color:var(--muted); margin: -8px 0 20px;"><span class="req" style="color:var(--red); font-weight:700;">*</span> Required field</p>

  <form id="poForm">
    <div class="card">
      <p class="section-title">Order details</p>
      <div class="grid">
        <div class="field">
          <label for="branch">Branch <span class="req">*</span></label>
          <select id="branch" required></select>
        </div>
        <div class="field">
          <label for="product">Product <span class="req">*</span></label>
          <select id="product" required></select>
        </div>
        <div class="field">
          <label for="vendor">Vendor <span class="req">*</span></label>
          <select id="vendor" required></select>
        </div>
        <div class="field">
          <label for="splitUp">Split up <span class="opt">(optional)</span></label>
          <select id="splitUp"><option value="">—</option></select>
        </div>
        <div class="field">
          <label for="poPurpose">Purchase order purpose <span class="req">*</span></label>
          <select id="poPurpose" required></select>
        </div>
        <div class="field">
          <label for="partnerName">Partner name <span class="opt">(optional)</span></label>
          <input id="partnerName" type="text" placeholder="Distributor / partner" />
        </div>
      </div>
      <div class="field" style="margin-top:4px;">
        <label style="display:flex; align-items:center; gap:8px; font-weight:500;">
          <input type="checkbox" id="poAttached" /> Purchase order document attached
        </label>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Stock aging (in Lakhs)</p>
      <div class="field">
        <label for="overallStock">Overall stock value <span class="req">*</span></label>
        <input id="overallStock" type="number" step="0.01" min="0" required />
      </div>
      <div class="grid cols-4" id="bucketInputs"></div>
      <div class="field" style="margin-top:16px;">
        <label for="currentOrderValue">Current order value <span class="req">*</span></label>
        <input id="currentOrderValue" type="number" step="0.01" min="0" required />
      </div>
    </div>

    <div class="card">
      <p class="section-title">Requested by</p>
      <div class="grid">
        <div class="field">
          <label for="creatorName">Your name <span class="req">*</span></label>
          <input id="creatorName" type="text" required />
        </div>
        <div class="field">
          <label for="creatorEmail">Your email <span class="req">*</span></label>
          <input id="creatorEmail" type="email" required />
        </div>
        <div class="field">
          <label for="creatorWhatsapp">Your WhatsApp number <span class="req">*</span> <span class="opt">(digits only, no +)</span></label>
          <input id="creatorWhatsapp" type="tel" placeholder="91XXXXXXXXXX" required />
        </div>
      </div>
    </div>

    <div class="card" id="previewCard" style="display:none;">
      <p class="section-title">Approval preview</p>
      <table class="calc-table" id="previewTable"></table>
      <div class="result-panel">
        <span>Automatic status:</span>
        <span id="previewStatus" class="status-pill"></span>
        <p class="note" id="previewNote"></p>
      </div>
    </div>

    <div style="display:flex; gap:12px; align-items:center;">
      <button type="button" class="ghost" id="previewBtn">Preview calculation</button>
      <button type="submit" class="primary" id="submitBtn">Submit PO</button>
    </div>

    <div id="resultMsg"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="reference.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
